<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#07090e" />
      <stop offset="100%" stop-color="#0d1322" />
    </linearGradient>

    <!-- Liquid Glass Glow Gradient -->
    <linearGradient id="glassGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Drop Shadow & Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="iconGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComponentTransfer in="blur" result="glow1">
        <feFuncA type="linear" slope="0.6"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="6" />

  <!-- Ambient Light Mesh Orbs -->
  <circle cx="140" cy="140" r="130" fill="#38bdf8" opacity="0.22" filter="url(#glow)" />
  <circle cx="370" cy="370" r="140" fill="#6366f1" opacity="0.22" filter="url(#glow)" />

  <!-- Specular Glass Border Inset Overlay -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="3" opacity="0.7" />

  <!-- Central Monogram Monolith Symbol: < MH /> -->
  <g filter="url(#iconGlow)">
    <!-- Left Bracket < -->
    <path d="M 155 200 L 105 256 L 155 312" fill="none" stroke="url(#glassGlow)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Right Bracket > -->
    <path d="M 357 200 L 407 256 L 357 312" fill="none" stroke="url(#glassGlow)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Center Slash / -->
    <path d="M 285 180 L 227 332" fill="none" stroke="#38bdf8" stroke-width="24" stroke-linecap="round" />

    <!-- Glowing Cyan Dot (Matching Navbar Logo) -->
    <circle cx="256" cy="375" r="14" fill="#38bdf8" filter="url(#glow)" />
  </g>
</svg>
